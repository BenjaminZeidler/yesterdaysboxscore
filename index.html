<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yesterday's Box Score</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400;1,700&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{--ink:#0a0a0a;--paper:#f5f0e8;--rule:#0a0a0a;--muted:#555}
    html,body{background:var(--paper);color:var(--ink);font-family:'Libre Baskerville',Georgia,serif;min-height:100vh}
    .masthead{border-bottom:4px double var(--rule);padding:.75rem 2rem .5rem;text-align:center}
    .masthead-top{display:flex;justify-content:space-between;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:4px;border-bottom:1px solid var(--rule);padding-bottom:4px}
    .nameplate{font-family:'Playfair Display',serif;font-size:clamp(2rem,5vw,3.8rem);font-weight:900;line-height:1;margin:6px 0 2px}
    .nameplate-sub{font-size:11px;font-style:italic;letter-spacing:.15em;color:var(--muted);border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);padding:3px 0;margin:4px auto;max-width:600px}
    .sport-nav{background:var(--ink);overflow-x:auto;white-space:nowrap;scrollbar-width:none}
    .sport-nav::-webkit-scrollbar{display:none}
    .sport-nav-inner{display:inline-flex;min-width:100%;justify-content:center}
    .sport-btn{background:none;border:none;border-right:1px solid #333;color:#aaa;font-family:'Libre Baskerville',serif;font-size:11px;letter-spacing:.12em;text-transform:uppercase;padding:10px 18px;cursor:pointer}
    .sport-btn:last-child{border-right:none}
    .sport-btn:hover{color:#fff;background:#1a1a1a}
    .sport-btn.active{color:var(--paper);background:#222;font-weight:700}
    .page{max-width:1100px;margin:0 auto;padding:1.5rem 2rem 3rem}
    .date-line{font-size:11px;font-style:italic;color:var(--muted);text-align:center;margin-bottom:1.5rem}
    .section-header{display:flex;align-items:center;gap:12px;margin:2rem 0 .75rem}
    .section-header-line{flex:1;height:2px;background:var(--rule)}
    .section-header h2{font-family:'Playfair Display',serif;font-size:.95rem;font-weight:700;letter-spacing:.25em;text-transform:uppercase;white-space:nowrap}
    .scores-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:1px;background:var(--rule);border:1px solid var(--rule);margin-bottom:2rem}
    .game-card{background:var(--paper);padding:.85rem 1rem}
    .game-status{font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
    .game-table{width:100%;border-collapse:collapse;font-size:13px}
    .game-table th{font-size:8px;letter-spacing:.12em;text-transform:uppercase;font-weight:400;color:var(--muted);text-align:right;padding:0 4px 3px;border-bottom:1px solid var(--rule)}
    .game-table th:first-child{text-align:left}
    .game-table td{padding:5px 4px;text-align:right;font-variant-numeric:tabular-nums;border-bottom:1px dotted #c8c0ae}
    .game-table tr:last-child td{border-bottom:none}
    .game-table td:first-child{text-align:left;font-family:'Playfair Display',serif;font-weight:700;font-size:14px}
    .game-table td.final-score{font-weight:700;font-size:16px;font-family:'Playfair Display',serif}
    .game-table td.loser{color:var(--muted)}
    .loading-block{text-align:center;padding:4rem 1rem;font-style:italic;color:var(--muted);font-size:14px}
    .loading-dots::after{content:'';animation:dots 1.5s steps(4,end) infinite}
    @keyframes dots{0%,20%{content:''}40%{content:'.'}60%{content:'..'}80%,100%{content:'...'}}
    footer{text-align:center;font-size:10px;letter-spacing:.1em;color:var(--muted);border-top:4px double var(--rule);padding:1rem 2rem;font-style:italic}
    @media(max-width:600px){.page{padding:1rem}.masthead{padding:.5rem 1rem}.sport-btn{padding:8px 12px;font-size:10px}.scores-grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <header class="masthead">
    <div class="masthead-top">
      <span id="dateline">—</span>
      <span>Established 2025</span>
      <span>Final Scores Only</span>
    </div>
    <div class="nameplate">Yesterday's Box Score</div>
    <div class="nameplate-sub">All the final scores — nothing more, nothing less</div>
  </header>

  <nav class="sport-nav">
    <div class="sport-nav-inner">
      <button class="sport-btn active" data-sport="all">All Sports</button>
      <button class="sport-btn" data-sport="mlb">Baseball</button>
      <button class="sport-btn" data-sport="nba">Basketball</button>
      <button class="sport-btn" data-sport="nhl">Hockey</button>
      <button class="sport-btn" data-sport="nfl">Football</button>
      <button class="sport-btn" data-sport="soccer">Soccer</button>
      <button class="sport-btn" data-sport="tennis">Tennis</button>
    </div>
  </nav>

  <main class="page">
    <p class="date-line">Scores from <span id="yesterday-str"></span></p>
    <div id="scores-root"><div class="loading-block"><span class="loading-dots">Fetching yesterday's scores</span></div></div>
  </main>

  <footer>All scores reflect final results from yesterday's games</footer>

  <script>
    const PROXY_URL = 'https://yesterdaysboxscore.vercel.app/api/scores';
    const SPORTS_META = {
      mlb: 'Major League Baseball',
      nba: 'NBA Basketball',
      nhl: 'NHL Hockey',
      nfl: 'NFL Football',
      soccer: 'Soccer',
      tennis: 'Tennis'
    };

    function getYesterday() {
      const d = new Date();
      d.setDate(d.getDate() - 1);
      return d;
    }

    function fmt(d) {
      return d.toLocaleDateString('en-US', {
        weekday: 'long',
        year: 'numeric',
        month: 'long',
        day: 'numeric'
      });
    }

    document.getElementById('yesterday-str').textContent = fmt(getYesterday());
    document.getElementById('dateline').textContent = fmt(new Date()).toUpperCase();

    let activeSport = 'all';
    let allData = {};

    document.querySelectorAll('.sport-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.sport-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        activeSport = btn.dataset.sport;
        renderScores();
      });
    });

    function renderScores() {
      const root = document.getElementById('scores-root');
      root.innerHTML = '';

      const sports = activeSport === 'all' ? Object.keys(allData) : [activeSport];
      let any = false;

      for (const sport of sports) {
        const d = allData[sport];
        if (!d || !d.games || !d.games.length) continue;
        any = true;

        const h = document.createElement('div');
        h.className = 'section-header';
        h.innerHTML = '<div class="section-header-line"></div><h2>' + (SPORTS_META[sport] || sport.toUpperCase()) + '</h2><div class="section-header-line"></div>';
        root.appendChild(h);

        const g = document.createElement('div');
        g.className = 'scores-grid';

        for (const game of d.games) {
          const c = document.createElement('div');
          c.className = 'game-card';
          c.innerHTML = buildCard(game, sport);
          g.appendChild(c);
        }

        root.appendChild(g);
      }

      if (!any) {
        root.innerHTML = '<div class="loading-block">No final scores found for yesterday.</div>';
      }
    }

    function buildCard(game, sport) {
      const { teams, innings, quarters, periods, stats, status, venue } = game;
      if (!teams || teams.length < 2) return '';

      const [away, home] = teams;
      const aw = away.score > home.score;
      const hw = home.score > away.score;

      let hc = '', ar = '', hr = '';

      if (sport === 'mlb' && innings && innings.length) {
        hc = innings.map((_, i) => '<th>' + (i + 1) + '</th>').join('') + '<th style="padding-left:8px">R</th><th>H</th><th>E</th>';
        ar = innings.map(n => '<td>' + (n.away ?? '-') + '</td>').join('') + '<td class="final-score ' + (aw ? '' : 'loser') + '" style="padding-left:8px">' + away.score + '</td><td class="' + (aw ? '' : 'loser') + '">' + (away.hits ?? '-') + '</td><td class="' + (aw ? '' : 'loser') + '">' + (away.errors ?? '-') + '</td>';
        hr = innings.map(n => '<td>' + (n.home ?? '-') + '</td>').join('') + '<td class="final-score ' + (hw ? '' : 'loser') + '" style="padding-left:8px">' + home.score + '</td><td class="' + (hw ? '' : 'loser') + '">' + (home.hits ?? '-') + '</td><td class="' + (hw ? '' : 'loser') + '">' + (home.errors ?? '-') + '</td>';
      } else if ((sport === 'nba' || sport === 'nfl') && quarters && quarters.length) {
        hc = quarters.map((_, i) => '<th>' + (i < 4 ? 'Q' + (i + 1) : 'OT' + (i - 3)) + '</th>').join('') + '<th style="padding-left:8px">F</th>';
        ar = quarters.map(q => '<td>' + (q.away ?? '-') + '</td>').join('') + '<td class="final-score ' + (aw ? '' : 'loser') + '" style="padding-left:8px">' + away.score + '</td>';
        hr = quarters.map(q => '<td>' + (q.home ?? '-') + '</td>').join('') + '<td class="final-score ' + (hw ? '' : 'loser') + '" style="padding-left:8px">' + home.score + '</td>';
      } else if (sport === 'nhl' && periods && periods.length) {
        hc = periods.map((_, i) => '<th>' + (i < 3 ? (i + 1) + 'P' : 'OT') + '</th>').join('') + '<th style="padding-left:8px">F</th>';
        ar = periods.map(p => '<td>' + (p.away ?? '-') + '</td>').join('') + '<td class="final-score ' + (aw ? '' : 'loser') + '" style="padding-left:8px">' + away.score + '</td>';
        hr = periods.map(p => '<td>' + (p.home ?? '-') + '</td>').join('') + '<td class="final-score ' + (hw ? '' : 'loser') + '" style="padding-left:8px">' + home.score + '</td>';
      } else {
        hc = '<th>Score</th>';
        ar = '<td class="final-score ' + (aw ? '' : 'loser') + '">' + away.score + '</td>';
        hr = '<td class="final-score ' + (hw ? '' : 'loser') + '">' + home.score + '</td>';
      }

      const sh = (stats && stats.length) ? '<div style="margin-top:6px; border-top:1px dotted #bbb; padding-top:5px;">' + stats.map(s => '<div style="display:flex; justify-content:space-between; font-size:11px; line-height:1.7; color:var(--muted);"><span>' + s.label + '</span><span>' + s.value + '</span></div>').join('') + '</div>' : '';

      return '<div class="game-status">' + (status || 'Final') + (venue ? ' • ' + venue : '') + '</div><table class="game-table"><thead><tr><th></th>' + hc + '</tr></thead><tbody><tr><td>' + away.name + '</td>' + ar + '</tr><tr><td>' + home.name + '</td>' + hr + '</tr></tbody></table>' + sh;
    }

    async function fetchAllScores() {
      const root = document.getElementById('scores-root');
      root.innerHTML = '<div class="loading-block"><span class="loading-dots">Fetching yesterday\'s scores</span></div>';

      const yestStr = fmt(getYesterday());
      const todayStr = fmt(new Date());

      const prompt = 'Today is ' + todayStr + '. Yesterday was ' + yestStr + '. List all final sports scores from yesterday (MLB, NBA, NHL, NFL, soccer, tennis). Return ONLY valid JSON with keys: mlb, nba, nhl, nfl, soccer, tennis. Each has a games array. Each game has: teams [{name, score}], status "Final", and for MLB add innings array plus hits/errors, for NBA/NFL add quarters array, for NHL add periods array. Include a stats array with 1-2 notable stats. No markdown, no explanation, just raw JSON.';

      try {
        const res = await fetch(PROXY_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            messages: [{ role: 'user', content: prompt }]
          })
        });

        const data = await res.json();

        if (data.error) {
          if (data.error.message && data.error.message.includes('rate_limit')) {
            root.innerHTML = '<div class="loading-block">Rate limit hit — retrying in 60 seconds...</div>';
            setTimeout(fetchAllScores, 60000);
            return;
          }
          throw new Error(data.error.message || 'API error');
        }

        const text = (data.content || []).filter(b => b.type === 'text').map(b => b.text).join('\n');
        const match = text.replace(/```json|```/g, '').trim().match(/\{[\s\S]*\}/);

        if (!match) throw new Error('No JSON in response');

        allData = JSON.parse(match[0]);
        renderScores();

      } catch (err) {
        root.innerHTML = '<div class="loading-block">Could not load scores — ' + (err.message || 'unknown error') + '</div>';
      }
    }

    fetchAllScores();
  </script>
</body>
</html>
